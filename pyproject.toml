[project]
name = "paper-alert-bot"
version = "0.1.0"
description = "Report-file weekly literature alerts for configured research topics."
authors = [{ name = "Joshua Pearson" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "respx>=0.21.1",
    "ruff>=0.14.0",
]

[project.scripts]
litreview = "litreview.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/litreview"]

[tool.ruff]
target-version = "py313"
exclude = ["tests/*"]

[tool.ruff.lint]
# Rule sets to enable
# E/W = pycodestyle, F = pyflakes, I = isort,
# UP = pyupgrade, B = flake8-bugbear, C4 = flake8-comprehensions,
# SIM = flake8-simplify, N = pep8-naming
# N = pep8-naming
# ANN  = flake8-annotations (requires type annotations)
# S = flake8-bandit
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N", "S"]
# N803/N806: uppercase argument/variable names follow linear-algebra convention
# (P, Q, R, Wm, Wc, Xp, K, …) throughout the control/observer code.
ignore = ["N803", "N806"]